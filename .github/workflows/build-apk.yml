name: Build Android APK (One Piece Edition)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Download Godot 4.7.2 & Export Templates
        run: |
          GODOT_VERSION=4.7.2-stable
          curl -sL https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm godot.zip

          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -sL https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz -o templates.tpz
          unzip -q templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates templates.tpz

      - name: Configure Godot Android Settings
        run: |
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          cat << EOC > "$SETTINGS_DIR/editor_settings-4.7.tres"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOC

      - name: Export Android Debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/HabitIsland-OnePiece.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitIsland-OnePiece-APK
          path: build/android/HabitIsland-OnePiece.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-onepiece
          name: "Habit Island: One Piece Edition 🏴‍☠️ (Android APK)"
          body: |
            🏴‍☠️ **Habit Island: One Piece Edition Hazır!**
            
            Luffy, Zoro, Sanji, Chopper ve Going Merry ile Grand Line macerası!
            Telefonunuza indirmek için aşağıdaki `HabitIsland-OnePiece.apk` dosyasına dokunun ve kurun.
          files: build/android/HabitIsland-OnePiece.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
